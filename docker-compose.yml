services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skilllink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - skilllink-data:/var/lib/postgresql/data

  api:
    build: ./SkillLink
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/skilllink
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DDL_AUTO: update
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      # Valores del tenant (ver docs/AZURE-ENTRA-ID.md)
      JWT_ISSUER: ${JWT_ISSUER:-https://login.microsoftonline.com/common/v2.0}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-configurar}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-https://login.microsoftonline.com/common/discovery/v2.0/keys}

volumes:
  skilllink-data:
