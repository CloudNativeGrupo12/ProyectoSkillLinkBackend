spring.datasource.url=jdbc:h2:mem:skilllink;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.security.issuer=https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0
app.security.audience=11111111-1111-1111-1111-111111111111
app.security.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
app.seed.enabled=true
