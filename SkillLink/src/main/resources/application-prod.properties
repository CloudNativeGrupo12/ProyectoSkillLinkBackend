# Produccion (AWS): todos los valores llegan por variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# JWT_ISSUER y JWT_AUDIENCE son obligatorios en produccion
app.security.issuer=${JWT_ISSUER}
app.security.audience=${JWT_AUDIENCE}
app.security.jwk-set-uri=${JWT_JWK_SET_URI:}
