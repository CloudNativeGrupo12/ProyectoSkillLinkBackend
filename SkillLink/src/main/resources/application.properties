spring.application.name=SkillLink
server.port=${PORT:8080}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.open-in-view=false

# --- CORS (acceso directo; tras API Gateway el gateway aplica su propia politica)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Resource Server (valores externalizados; ver docs/AZURE-ENTRA-ID.md)
app.security.issuer=${JWT_ISSUER:}
app.security.audience=${JWT_AUDIENCE:}
app.security.jwk-set-uri=${JWT_JWK_SET_URI:}
app.security.read-scope=${APP_READ_SCOPE:skilllink.read}
app.security.write-scope=${APP_WRITE_SCOPE:skilllink.write}
app.security.admin-role=${APP_ADMIN_ROLE:ADMIN}

# --- Datos de demostracion (se cargan solo si la base esta vacia)
app.seed.enabled=${APP_SEED_ENABLED:true}
