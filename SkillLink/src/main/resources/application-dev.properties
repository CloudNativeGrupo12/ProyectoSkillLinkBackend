spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skilllink}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AZURE_JWKS_URI:https://login.microsoftonline.com/skilllink-tenant/discovery/v2.0/keys}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI:https://login.microsoftonline.com/skilllink-tenant/v2.0}