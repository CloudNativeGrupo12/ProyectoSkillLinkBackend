# Desarrollo local con PostgreSQL (docker compose up db)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skilllink}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Sin tenant configurado se usan las claves globales de Entra ID; con JWT_ISSUER definido se valida el issuer.
app.security.jwk-set-uri=${JWT_JWK_SET_URI:https://login.microsoftonline.com/common/discovery/v2.0/keys}
