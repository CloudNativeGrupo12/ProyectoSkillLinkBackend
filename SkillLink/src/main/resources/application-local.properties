# Desarrollo local sin Docker: H2 en archivo con compatibilidad PostgreSQL
spring.datasource.url=jdbc:h2:file:./data/skilllink;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.security.jwk-set-uri=${JWT_JWK_SET_URI:https://login.microsoftonline.com/common/discovery/v2.0/keys}
